<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 背景：アプリの色。iPhone が角を丸めるので四角のままにする -->
  <rect width="512" height="512" fill="#e58fa1"/>
  <!-- 哺乳びん（中央の約6割に収めて、丸く切り抜かれても欠けないようにする） -->
  <g fill="#ffffff">
    <!-- 乳首 -->
    <path d="M232 118 Q232 92 256 92 Q280 92 280 118 L286 150 L226 150 Z"/>
    <!-- キャップ -->
    <rect x="200" y="150" width="112" height="34" rx="10"/>
    <!-- 本体 -->
    <rect x="186" y="194" width="140" height="226" rx="34"/>
  </g>
  <!-- 目盛り -->
  <g stroke="#e58fa1" stroke-width="10" stroke-linecap="round">
    <line x1="210" y1="260" x2="246" y2="260"/>
    <line x1="210" y1="310" x2="236" y2="310"/>
    <line x1="210" y1="360" x2="246" y2="360"/>
  </g>
</svg>
